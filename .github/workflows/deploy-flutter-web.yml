name: Deploy Flutter Web (Mobile App)

on:
  push:
    branches: [main]
    paths:
      - 'merkato-mobile/**'
      - '.github/workflows/deploy-flutter-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'flutter-web'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create production env
        working-directory: merkato-mobile
        run: |
          echo "API_URL=${{ vars.API_URL || secrets.API_URL || 'https://merkato-backend.onrender.com' }}" > .env

      - name: Build Flutter web
        working-directory: merkato-mobile
        run: |
          flutter pub get
          flutter build web --release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: merkato-mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
